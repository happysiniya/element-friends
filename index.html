<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원소 친구 도감</title>
  <meta name="description" content="118개 원소를 스티커처럼 모으며 배우는 주기율표 놀이">
  <meta name="theme-color" content="#2D3FA6">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="logo">원소 친구 도감</h1>
      <div class="counters" id="counters"></div>
      <button id="sound-toggle" class="icon-btn" title="효과음 켜기/끄기">🔊</button>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="table">주기율표</button>
      <button class="tab" data-view="quiz">퀴즈</button>
      <button class="tab" data-view="kitchen">원소 요리사</button>
    </nav>
  </header>

  <main>
    <section id="view-table" class="view">
      <div class="table-head">
        <div id="today" class="today"></div>
        <div class="finder">
          <input id="search" type="search" placeholder="이름, 기호, 번호로 찾기 (철, Fe, 26)" autocomplete="off">
          <div class="legend" id="legend"></div>
          <p class="legend-desc" id="legend-desc"></p>
        </div>
      </div>
      <div class="ptable-wrap">
        <div class="ptable" id="ptable"></div>
      </div>
      <p class="tip">빈 칸을 누르면 원소 카드가 열리고 스티커가 붙어요. 퀴즈에서 맞힌 원소는 반짝이 스티커가 돼요.</p>
    </section>

    <section id="view-quiz" class="view" hidden>
      <div id="quiz"></div>
    </section>

    <section id="view-kitchen" class="view" hidden>
      <div id="kitchen"></div>
    </section>
  </main>

  <footer class="footer">
    <!-- 아이가 실수로 기록을 지우지 않게: 접힌 메뉴 + 어른 확인 곱셈 + 마지막 확인 -->
    <details class="grown-up" id="grown-up">
      <summary>어른용 메뉴</summary>
      <div class="grown-up-body">
        <p>모은 스티커, 반짝이, 요리 기록을 모두 지우고 처음부터 시작해요. 지운 기록은 되돌릴 수 없어요.</p>
        <form id="reset-form" class="reset-form" autocomplete="off">
          <label for="reset-answer">어른 확인: <b id="reset-q"></b> =</label>
          <input id="reset-answer" inputmode="numeric" pattern="[0-9]*" size="4">
          <button type="submit" class="small-btn danger">기록 모두 지우기</button>
        </form>
        <p class="reset-msg" id="reset-msg"></p>
      </div>
    </details>
  </footer>

  <dialog id="card">
    <div class="card-inner">
      <button class="close-btn" id="card-close" title="닫기">✖</button>
      <div id="card-body"></div>
      <div class="card-nav">
        <button class="nav-btn" data-dir="left"></button>
        <button class="nav-btn" data-dir="up"></button>
        <button id="card-challenge" class="challenge-btn">✨ 반짝이 도전</button>
        <button class="nav-btn" data-dir="down"></button>
        <button class="nav-btn" data-dir="right"></button>
      </div>
    </div>
  </dialog>

  <div id="fx" aria-hidden="true"></div>

  <script src="js/elements.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/kitchen.js"></script>
  <script>
    App.init();
    // 앱 설치와 오프라인용 (https 주소에서만. 내 컴퓨터에서 파일로 열 때는 안 써요)
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
